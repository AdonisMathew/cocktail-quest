name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/CoctelIQ.Api
    env:
      # Valores de prueba solo para el CI: no se conecta a ninguna base.
      ConnectionStrings__DefaultConnection: "Host=localhost;Database=ci;Username=ci;Password=ci"
      Jwt__Key: "clave-de-ci-solo-para-compilar-0123456789"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Verificar que no falten migraciones
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release
